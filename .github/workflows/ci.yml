name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: acm
          POSTGRES_PASSWORD: acm_dev_password
          POSTGRES_DB: acm
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma DB Push & Seed
        env:
          DATABASE_URL: postgresql://acm:acm_dev_password@localhost:5433/acm
        run: |
          npm run db:push
          npm run db:seed

      - name: Run Policy Engine & Integration Tests
        env:
          DATABASE_URL: postgresql://acm:acm_dev_password@localhost:5433/acm
          PORT: 3000
          RAZORPAY_KEY_ID: rzp_test_dummy
          RAZORPAY_KEY_SECRET: dummy_secret
          RAZORPAY_WEBHOOK_SECRET: dummy_webhook_secret
          NODE_ENV: test
        run: npm test
